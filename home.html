
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beautiful HTML Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f4f6f9;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      padding: 2rem 1rem;
      text-align: center;
      color: white;
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.2rem;
    }

    nav {
      display: flex;
      justify-content: center;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    nav a {
      text-decoration: none;
      color: #4facfe;
      padding: 1rem 2rem;
      transition: background 0.3s ease;
    }

    nav a:hover {
      background: #f0f8ff;
    }

    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .section {
      margin-bottom: 3rem;
    }

    .section h2 {
      color: #333;
      margin-bottom: 1rem;
    }

    .about {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: center;
    }

    .about img {
      width: 300px;
      border-radius: 10px;
    }

    .contact form {
      display: grid;
      gap: 1rem;
    }

    .contact input,
    .contact textarea {
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: vertical;
    }

    .contact button {
      padding: 0.8rem;
      background: #4facfe;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .contact button:hover {
      background: #00c6ff;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background: #e0f7fa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Page</h1>
    <p>Modern, Simple and Beautiful Design</p>
  </header>

  <nav>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <div class="container">
    <section class="section about" id="about">
      <img src="https://source.unsplash.com/300x300/?nature" alt="Nature">
      <div>
        <h2>About Me</h2>
        <p>
          Hello! I'm passionate about building beautiful web interfaces and creating user-friendly designs. I enjoy working with HTML, CSS, and JavaScript to bring ideas to life.
        </p>
      </div>
    </section>

    <section class="section contact" id="contact">
      <h2>Contact Me</h2>
      <form>
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Your Email" required />
        <textarea rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </div>

  <footer>
    &copy; 2025 Your Name | Designed with 💙
  </footer>
</body>
</html>
